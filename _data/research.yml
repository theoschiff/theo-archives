- title: CAPO
  subtitle: Compute-Aware Automated Protein-Model Optimization
  context: BIIE · Master's thesis · January–July 2026
  description: An agentic system for end-to-end protein-model optimization, evaluated through three protein-engineering tasks and ablation studies. The project explores how to make model optimization effective under compute constraints.
  supervision: T. Bikias and M.-A. Hartley
  recognition:
    - text: Thesis grade 6/6
      tone: grade
      tone: grade
    - text: Best Poster Award at OxML 2026 Health & Bio Track
      tone: award
    - text: and accepted to NeurIPS AgenticLS workshop
      tone: acceptance
  figures:
    - src: /assets/img/capo/fig1_final.png
      alt: CAPO system overview and workflow
      caption: System overview
      width: 3508
      height: 1981
    - src: /assets/img/capo/fig3_eff.png
      alt: CAPO cost and GPU time comparison charts
      caption: Compute efficiency
      width: 3508
      height: 1321
  links:
    - label: View poster
      url: /assets/poster/CAPO_OxML_A0.pdf
  tags: [Protein engineering, Agentic systems, Compute efficiency]
- title: GraphRAG for immunology
  context: BIIE · Research internship
  description: Built a retrieval pipeline over an immunology corpus using an entity graph and Personalized PageRank, and benchmarked it against production RAG.
  tags: [Retrieval, Knowledge graphs, Immunology]
- title: Multimeditron
  context: EPFL · LiGHT Lab · Master's project
  description: Developed an 8B parameter modular multimodal medical language model trained from scratch, exploring mixture-of-experts and embedding-projection fusion.
