- title: Eliciting Reasoning in LLMs using Logprob-based Rewards
  context: EPFL · Master's project
  description: Explored log-probability rewards with GRPO to elicit language-model reasoning across mathematics and poetry tasks.
  links:
    - label: View poster
      url: /assets/poster/Poster_RL.pdf
  tags: [LLM reasoning, Reinforcement learning]
- title: "Small But Mighty: Achieving High Accuracy with Small Language Models on scientific MCQ answering"
  context: EPFL · Modern NLP · Spring 2025
  description: In this 10-week project, our group of three aimed to improve a small language model on scientific question answering using EPFL exam questions. We fine-tuned and quantized the model for single-GPU training, applied Direct Preference Optimization (DPO), and expanded its knowledge with Retrieval-Augmented Generation (RAG).
  links:
    - label: See project report
      url: /assets/reports/Final_Report_MNLP.pdf
  tags: [Small language models, Scientific QA, DPO, RAG]
- title: Food recognition with multimodal LLMs
  context: EPFL · Bachelor's thesis · Fall 2024
  description: Investigated multimodal large language models for food recognition.
  supervision: Prof. Marcel Salathé
  recognition:
    - text: Thesis grade 6/6
      tone: grade
      tone: grade
  tags: [Multimodal models, Food recognition]
- title: Germline mutation pathogenicity
  context: MIT CSAIL · Regina Barzilay Group · August–September 2022
  description: Fine-tuned sequence-only models to predict germline mutation pathogenicity across 70 ClinVar cancer genes, achieving an AUC of 0.875.
  supervision: Jeremy Wohlwend
  tags: [Genomics, Sequence models, Cancer]
